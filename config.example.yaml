app:
  env: development

http:
  addr: :8080
  read_timeout: 10s
  write_timeout: 30s

database:
  driver: auto
  sqlite_path: data/fluffcatch.db
  host: 127.0.0.1
  port: 3306
  user: fluffcatch
  password: fluffcatch
  database: fluffcatch
  charset: utf8mb4
  location: Local
  parse_time: true
  connect_on_start: true
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 25m
  conn_max_idle_time: 5m
  timeout: 5s
  read_timeout: 30s
  write_timeout: 30s
  connect_retries: 5
  connect_retry_delay: 2s

storage:
  driver: local
  local_path: data/uploads
  public_prefix: /media

upload:
  max_size_mb: 50
  max_video_size_mb: 200

auth:
  admin_username: admin
  admin_password_hash: ""
  session_secret: ""

oidc:
  enabled: false
  provider: Keycloak
  issuer_url: ""
  client_id: ""
  client_secret: ""
  bound_subject: ""
